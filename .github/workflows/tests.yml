name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  jest:
    name: Jest unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test -- --watchAll=false --ci --reporters=default --passWithNoTests
        env:
          CI: true

      - name: Run build (sanity check)
        run: npm run build
        env:
          CI: false
          GENERATE_SOURCEMAP: false
